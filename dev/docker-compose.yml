# Throwaway Home Assistant for developing Adaptive Audio. NOT a production stack: it lives
# in this repo, not in LukasScarfe/containers. The integration is bind-mounted from the
# checkout, so a `docker compose restart` picks up edits. State under ./config is gitignored.
# Also serves the online tester from the checkout (site/ + the pure .py files) on :8127.
# Up:   docker compose -f dev/docker-compose.yml up -d     (HA: http://raccoon:8126, tester: :8127)
# Down: docker compose -f dev/docker-compose.yml down       (wipe: rm -rf dev/config/*)
services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: adaptive-audio-dev-ha
    restart: unless-stopped
    mem_limit: 2g
    ports:
      - "8126:8123"
    environment:
      - TZ=America/Vancouver
    volumes:
      - ./config:/config
      - ../custom_components/adaptive_audio:/config/custom_components/adaptive_audio:ro

  tester:
    image: caddy:2.10.2-alpine
    container_name: adaptive-audio-tester
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "8127:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../site:/srv/site:ro
      - ../custom_components/adaptive_audio:/srv/integration:ro
