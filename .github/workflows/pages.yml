# Publishes the online tester (site/) to GitHub Pages, with the integration's own schedule
# math copied in so the page always matches the integration.
name: Tester page
on:
  push:
    branches: [main]
    paths: ["site/**", "custom_components/adaptive_volume/const.py", "custom_components/adaptive_volume/schedule.py", "custom_components/adaptive_volume/curve.py", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cp -r site _site
          mkdir -p _site/py
          cp custom_components/adaptive_volume/{const,schedule,curve}.py _site/py/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
